name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip \
          build-essential \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgstreamer1.0-dev \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          openjdk-17-jdk \
          zip \
          unzip

    - name: Install buildozer and kivy
      run: |
        pip3 install --upgrade pip
        pip3 install buildozer cython==0.29.37 kivy==2.3.1

    - name: Set up Android SDK (includes aidl)
      uses: android-actions/setup-android-sdk@v3
      with:
        api-level: 33
        build-tools: 33.0.2

    - name: Build APK
      run: |
        # 设置 warn_on_root=0 避免 root 权限警告
        sed -i 's/warn_on_root = 1/warn_on_root = 0/' buildozer.spec
        # 设置 Android SDK 路径（使用 setup-android-sdk 安装的路径）
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        buildozer -v android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: android-apk
        path: bin/*.apk
        retention-days: 30
